name: CUDA Compile Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - ".github/workflows/cuda-compile.yml"

permissions:
  contents: read

jobs:
  compile:
    name: CUDA 12.6 compile-only
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes cmake ninja-build g++ libbenchmark-dev libgtest-dev
      - name: Configure CUDA build
        run: >-
          cmake -S . -B build-cuda -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DHELIX_ENABLE_CUDA=ON
          -DHELIX_BUILD_TESTS=ON
          -DHELIX_BUILD_BENCHMARKS=ON
          -DHELIX_BUILD_EXAMPLES=OFF
          -DHELIX_FETCH_DEPENDENCIES=OFF
          -DHELIX_WARNINGS_AS_ERRORS=ON
      - name: Compile CUDA and host targets
        run: cmake --build build-cuda
      - name: Run hardware-independent tests
        run: ctest --test-dir build-cuda -LE gpu --output-on-failure
      - name: List excluded GPU runtime tests
        run: ctest --test-dir build-cuda -N -L gpu

# This job has a CUDA compiler but no NVIDIA device. It validates compilation and
# CPU tests only. Tests labeled "gpu" are listed, not executed, and no runtime or
# performance claim is derived from this workflow.
